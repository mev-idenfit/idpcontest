<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome - SAML2 Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #0d6efd;
            margin: 0;
        }

        p {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            background-color: #0d6efd;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .button:hover {
            background-color: #0a58ca;
        }

        .button.red {
            background-color: #dc3545;
        }

        .button.red:hover {
            background-color: #b52a36;
        }

        .top-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .left {
            text-align: left;
        }

        .right {
            text-align: right;
        }

        dl {
            text-align: left;
            margin-top: 20px;
        }

        dt {
            font-weight: bold;
        }

        dd {
            margin: 0 0 10px 0;
            color: #555;
        }

    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>SAML2 Demo</h1>
        <form th:if="${emailAddress != null}" th:action="@{/logout/saml2/slo}" method="post">
            <button type="submit" class="button red">Logout</button>
        </form>
    </div>

    <!-- Giriş yapılmamışsa -->
    <div th:if="${emailAddress == null}">
        <p>Hello, guest 👋</p>
        <div class="top-actions">
            <a th:href="@{/secured}" class="button">Login SAML</a>
            <a th:href="@{/admin}" class="button">Admin</a>
        </div>
    </div>

    <!-- Giriş yapılmışsa -->
    <div th:if="${emailAddress != null}" class="left">
        <p><strong>User:</strong> <span th:text="${name}">name</span></p>
        <p><strong>Email:</strong> <span th:text="${emailAddress}">email</span></p>

        <div class="right">
            <a th:href="@{/admin}" class="button">Admin</a>
        </div>
    </div>

</div>
</body>
</html>
