<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Page</title>
    <style>
        body { font-family: sans-serif; padding: 50px; background: #f0f2f5; }
        .box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .alert {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>Admin Panel</h2>
    <a th:href="@{/}" style="display:inline-block; margin-top: 20px;">← Back to Home</a>

    <div th:if="${authorized}">
        <p>✅ You are authorized as <strong th:text="${emailAddress}">user@example.com</strong></p>

        <h3 style="margin-top: 30px;">Attributes</h3>
        <dl th:each="userAttribute : ${userAttributes}">
            <dt th:text="${userAttribute.key}"></dt>
            <dd th:text="${userAttribute.value}"></dd>
        </dl>
    </div>

    <div th:if="${!authorized}">
        <p class="alert">🚫 You are not authorized to view this page.</p>
    </div>

</div>
</body>
</html>
